# S-Lab HRMS production stack. Normally started by ./deploy.sh, not by hand.
# Settings come from .env.production (created by deploy.sh on first run).

services:
  db:
    # Postgres 18 keeps its data under /var/lib/postgresql/18/docker, so the volume mounts at /var/lib/postgresql.
    image: public.ecr.aws/docker/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms -d hrms"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off: applies database migrations (and seeds the owner when asked).
  migrate:
    image: s-lab-hrms-migrate:${IMAGE_TAG:-current}
    build:
      context: .
      target: builder
    env_file: .env.production
    environment:
      # HRMS_DATABASE_URL (in .env.production) points at an external Postgres; otherwise the bundled db is used.
      DATABASE_URL: ${HRMS_DATABASE_URL:-postgresql://hrms:${POSTGRES_PASSWORD}@db:5432/hrms}
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    profiles: ["tools"]

  app:
    image: s-lab-hrms:${IMAGE_TAG:-current}
    build:
      context: .
      target: runner
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    env_file: .env.production
    environment:
      # HRMS_DATABASE_URL (in .env.production) points at an external Postgres; otherwise the bundled db is used.
      DATABASE_URL: ${HRMS_DATABASE_URL:-postgresql://hrms:${POSTGRES_PASSWORD}@db:5432/hrms}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Newest Android APK, stored here so /download is served by this site itself.
      - apkdata:/data/apk
    # Only reachable from this server. The public reaches it through the Cloudflare tunnel.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

  # Cloudflare tunnel (enabled by deploy.sh when CLOUDFLARE_TUNNEL_TOKEN is set).
  # In Cloudflare Zero Trust, the tunnel's public hostname hrms.s-lab.dev must point to http://app:3000
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app
    profiles: ["tunnel"]

volumes:
  pgdata18:
  apkdata:
