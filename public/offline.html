<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a3cff">
<title>Offline · S-Lab HRMS</title>
<style>
  :root { --bg: #f3f4f7; --card: #fff; --text: #111318; --muted: #5f6573; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0c10; --card: #16181d; --text: #eceef2; --muted: #a0a6b2; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .hero { background: linear-gradient(135deg, #6a1bff, #4a3cff 55%, #1f6bff); color: #fff; text-align: center; padding: calc(48px + env(safe-area-inset-top)) 24px 80px; border-radius: 0 0 36px 36px; }
  .hero img { width: 84px; height: 84px; border-radius: 22px; padding: 4px; background: rgba(255,255,255,.22); }
  h1 { margin: 14px 0 4px; font-size: 28px; letter-spacing: -0.02em; }
  .hero p { margin: 0; opacity: .85; }
  .card { max-width: 380px; margin: -44px auto 0; background: var(--card); border-radius: 28px; padding: 22px; box-shadow: 0 10px 30px rgba(15,23,42,.12); }
  .card h2 { margin: 0 0 6px; font-size: 20px; }
  .card p { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
  button { width: 100%; height: 48px; border: 0; border-radius: 999px; color: #fff; font: 600 15px system-ui, sans-serif; background: linear-gradient(135deg, #6a1bff, #4a3cff 55%, #1f6bff); cursor: pointer; }
</style>
</head>
<body>
  <div class="hero">
    <img src="/icons/icon-192.png" alt="S-Lab HRMS logo">
    <h1>S-Lab HRMS</h1>
    <p>Face attendance and salary for your business</p>
  </div>
  <div class="card">
    <h2>You're offline</h2>
    <p>Attendance and salary need the internet, so they are never shown from an old copy. Connect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
