name: Android APK

# Builds the native Android app in mobile/ (Expo / React Native).
# Push to main -> publish the APK as the newest GitHub Release. The website's /download link serves it,
#                 and installed apps show the "new update" prompt.
# Other branches -> APK kept as a workflow artifact only (for testing).
on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      APP_URL: ${{ vars.APP_URL || 'https://hrms.s-lab.dev' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 2.0.${{ github.run_number }}
      IS_RELEASE: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - run: npm ci

      - name: Check types and lint
        run: |
          npx tsc --noEmit
          npx expo lint

      # GitHub's Ubuntu runners include the Android SDK (ANDROID_HOME).
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      # Native build cache: expo prebuild --clean wipes android/, so restore
      # AFTER prebuild. Skips recompiling unchanged C++ (the slowest part).
      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: |
            mobile/android/.cxx
            mobile/android/app/build
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/transforms-3
          key: android-native-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json') }}
          restore-keys: android-native-

      - name: Gradle build cache on
        working-directory: mobile/android
        run: |
          touch gradle.properties
          grep -q '^org.gradle.caching=' gradle.properties || echo 'org.gradle.caching=true' >> gradle.properties
          grep -q '^org.gradle.parallel=' gradle.properties || echo 'org.gradle.parallel=true' >> gradle.properties

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/s-lab-hrms.apk"

      - name: Sign with release key (when configured)
        id: signing
        working-directory: ${{ github.workspace }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set. The APK is signed with a debug key; each new APK must be installed after uninstalling the old one (see DEPLOYMENT.md)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out s-lab-hrms-signed.apk s-lab-hrms.apk
          "$BT/apksigner" verify s-lab-hrms-signed.apk
          mv s-lab-hrms-signed.apk s-lab-hrms.apk
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: s-lab-hrms-${{ env.VERSION_NAME }}
          path: s-lab-hrms.apk

      - name: Publish release (main only)
        if: env.IS_RELEASE == 'true'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="Native Android app ${VERSION_NAME} for ${APP_URL}. Built from ${GITHUB_SHA::7}."
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            NOTE="$NOTE TEST BUILD (debug key): uninstall the old app before installing this one."
          fi
          gh release create "apk-v${VERSION_CODE}" s-lab-hrms.apk \
            --title "${VERSION_NAME}" \
            --notes "$NOTE" \
            --target "$GITHUB_SHA" \
            --latest
